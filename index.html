<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kindle Notes</title>
    <style>
        body { font-family: sans-serif; background: white; color: black; padding: 10px; margin: 0; }
        .header { text-align: center; margin-bottom: 12px; border-bottom: 2px dashed black; padding-bottom: 8px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: bold; }
        .header p { margin: 4px 0 0 0; font-size: 14px; font-style: italic; }
        .tabs-list { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
        .tab-item { flex: 1; font-size: 14px; font-weight: bold; padding: 12px 2px; text-align: center; background: white; border: 3px solid black; cursor: pointer; }
        .tab-item.active { background: black; color: white; }
        .textarea-box { border: 4px solid black; padding: 2px; background: white; }
        textarea { width: 100%; height: 260px; font-size: 20px; font-weight: bold; border: none; padding: 8px; box-sizing: border-box; resize: none; line-height: 1.5; }
        textarea:focus { outline: none; }
        .save-btn { width: 100%; font-size: 18px; font-weight: bold; padding: 15px; margin-top: 5px; background: white; border: 4px solid black; cursor: pointer; }
        .save-btn:active { background: black; color: white; }
        .counter { text-align: right; font-size: 14px; font-weight: bold; margin-top: 5px; }
        #status-msg { text-align: center; margin-top: 10px; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Kindle Notes</h1>
        <p>Заметки и цитаты / Notes & Quotes</p>
    </div>

    <div class="tabs-list">
        <div id="tab1" class="tab-item active" onclick="switchTab(1)">Заметка 1 / Note 1</div>
        <div id="tab2" class="tab-item" onclick="switchTab(2)">Заметка 2 / Note 2</div>
        <div id="tab3" class="tab-item" onclick="switchTab(3)">Заметка 3 / Note 3</div>
    </div>

    <div class="textarea-box">
        <textarea id="textInput" maxlength="400" oninput="updateCounter()" placeholder="Нажмите и пишите... / Click and write..."></textarea>
    </div>
    <div class="counter"><span id="charCount">0</span> / 400</div>

    <button class="save-btn" onclick="saveToUrl()">Сохранить в закладку / Save to Bookmark</button>

    <div id="status-msg"></div>

    <script>
        var notesData = { 1: "", 2: "", 3: "" };
        var currentTab = 1;

        window.onload = function() {
            var hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    var decoded = decodeURIComponent(hash).split('|||');
                    if (decoded.length === 3) {
                        notesData[1] = decoded[0];
                        notesData[2] = decoded[1];
                        notesData[3] = decoded[2];
                    }
                } catch(e) {}
            }
            document.getElementById('textInput').value = notesData[currentTab];
            updateCounter();
        };

        function switchTab(tabNum) {
            notesData[currentTab] = document.getElementById('textInput').value;
            currentTab = tabNum;

            var tabs = document.getElementsByClassName('tab-item');
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }

            document.getElementById('tab' + tabNum).classList.add('active');
            document.getElementById('textInput').value = notesData[tabNum];
            updateCounter();
        }

        function updateCounter() {
            document.getElementById('charCount').innerText = document.getElementById('textInput').value.length;
        }

        function saveToUrl() {
            notesData[currentTab] = document.getElementById('textInput').value;
            var combined = encodeURIComponent(notesData[1] + "|||" + notesData[2] + "|||" + notesData[3]);
            window.location.hash = combined;
            var msg = document.getElementById('status-msg');
            msg.innerHTML = "ГОТОВО! ОБНОВИТЕ ЗАКЛАДКУ В БРАУЗЕРЕ!<br>DONE! UPDATE THE BOOKMARK IN BROWSER!";
        }
    </script>
</body>
</html>
